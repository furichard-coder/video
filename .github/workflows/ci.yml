name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install FFmpeg (integration tests shell out to ffmpeg/ffprobe)
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
