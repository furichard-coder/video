name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install FFmpeg 8.1.2 (pinned to local toolchain; 9.x drops filter_complex_script)
        run: choco install ffmpeg --version=8.1.2 -y

      - name: Show FFmpeg version
        run: |
          where.exe ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
