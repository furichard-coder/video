name: Release

# Full `npm run package:win` still requires the shutter sound asset at a fixed
# local path (see scripts/package-win.mjs), so cloud packaging stays local
# until that path becomes configurable. This workflow ships the verified web
# build (dist + dist-electron) as a versioned GitHub Release instead.
#
# Trigger: push a tag like v0.56.0, or run manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install FFmpeg 8.1.2 (pinned to local toolchain; 9.x drops filter_complex_script)
        run: choco install ffmpeg --version=8.1.2 -y

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Pack dist output
        run: Compress-Archive -Path dist,dist-electron -DestinationPath scenerywalker-dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: scenerywalker-dist.zip
          generate_release_notes: true
